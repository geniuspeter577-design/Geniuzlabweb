{% extends "base.html" %}
{% block title %}Fund Wallet | GeniuzLab{% endblock %}
{% block content %}
<section class="app-page">
    <div class="app-header">
        <h1>Fund Your Wallet</h1>
        <p>Choose a provider and amount. Live checkout activates automatically once API keys are configured.</p>
    </div>

    <form method="POST" class="form-box">
        {% csrf_token %}
        <input type="hidden" name="purpose" value="wallet_funding">
        <div class="form-group">
            <label>Amount (₦)</label>
            <input type="number" step="0.01" min="1" name="amount" id="amountInput" required>
            <div class="amount-chips">
                <button type="button" class="amount-chip" data-amount="1000">₦1,000</button>
                <button type="button" class="amount-chip" data-amount="5000">₦5,000</button>
                <button type="button" class="amount-chip" data-amount="10000">₦10,000</button>
                <button type="button" class="amount-chip" data-amount="25000">₦25,000</button>
            </div>
        </div>
        <div class="form-group">
            <label>Payment Provider</label>
            <select name="provider">
                <option value="paystack">Paystack{% if not providers.paystack.secret_key %} (not configured){% endif %}</option>
                <option value="flutterwave">Flutterwave{% if not providers.flutterwave.secret_key %} (not configured){% endif %}</option>
            </select>
        </div>
        <div class="form-group">
            <label>Note (optional)</label>
            <input type="text" name="description" placeholder="e.g. Wallet top-up">
        </div>
        <button type="submit" class="btn-primary">Continue</button>
    </form>
</section>
{% block extra_js %}
<script>
document.querySelectorAll(".amount-chip").forEach(function(btn){
    btn.addEventListener("click", function(){
        document.getElementById("amountInput").value = btn.dataset.amount;
        document.querySelectorAll(".amount-chip").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
    });
});
</script>
{% endblock %}
{% endblock %}

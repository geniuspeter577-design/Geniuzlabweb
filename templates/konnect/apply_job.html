{% extends "base.html" %}
{% block title %}Apply | {{ job.title }}{% endblock %}
{% block content %}
<section class="app-page">
    <div class="app-header"><h1>Apply for {{ job.title }}</h1></div>
    <form method="POST" class="form-box">
        {% csrf_token %}
        <div class="form-group"><label>Cover Letter</label><textarea name="cover_letter" rows="6" required placeholder="Tell them why you're the right fit..."></textarea></div>
        <button type="submit" class="btn-primary">Submit Application</button>
        <a href="{% url 'job_detail' job.pk %}" class="btn-outline">Cancel</a>
    </form>
</section>
{% endblock %}

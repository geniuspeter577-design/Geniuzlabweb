{% extends "base.html" %}
{% block title %}Upload Project | GeniuzLab{% endblock %}
{% block content %}
<section class="app-page">
    <div class="app-header">
        <h1>Upload Project</h1>
        <p>This will appear in your portfolio and everyone's Home Feed immediately.</p>
    </div>
    <form method="POST" enctype="multipart/form-data" class="form-box">
        {% csrf_token %}
        <div class="form-group"><label>Title</label><input type="text" name="title" required></div>
        <div class="form-group"><label>Description</label><textarea name="description" rows="4"></textarea></div>
        <div class="form-group">
            <label>Category</label>
            <select name="category">
                {% for value, label in categories %}
                <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group"><label>External Link (optional)</label><input type="url" name="link" placeholder="https://..."></div>
        <div class="form-group"><label>Cover Image (optional — first gallery image is used if left blank)</label><input type="file" name="image" accept="image/*"></div>
        <div class="form-group">
            <label>Gallery — Images/Videos (select multiple)</label>
            <input type="file" name="gallery" accept="image/*,video/mp4,video/quicktime,video/webm" multiple>
        </div>
        <button type="submit" class="btn-primary">Publish Project</button>
    </form>
</section>
{% endblock %}

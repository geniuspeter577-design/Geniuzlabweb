{% extends "base.html" %}
{% block title %}Post a Job | GeniuzLab{% endblock %}
{% block content %}
<section class="app-page">
    <div class="app-header"><h1>Post a Job</h1></div>
    <form method="POST" class="form-box">
        {% csrf_token %}
        <div class="form-group"><label>Job Title</label><input type="text" name="title" required></div>
        <div class="form-group"><label>Category</label>
            <select name="category">
                {% for value, label in categories %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group"><label>Description</label><textarea name="description" rows="5" required></textarea></div>
        <div class="form-group"><label>Budget (₦, optional)</label><input type="number" step="0.01" name="budget"></div>
        <div class="form-group"><label>Deadline (optional)</label><input type="date" name="deadline"></div>
        <button type="submit" class="btn-primary">Post Job</button>
    </form>
</section>
{% endblock %}

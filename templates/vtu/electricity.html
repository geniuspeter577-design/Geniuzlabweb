{% extends "base.html" %}
{% block title %}Electricity | GeniuzSubs{% endblock %}
{% block content %}
<section class="app-page">
    <div class="app-header"><h1>Pay Electricity Bill</h1></div>

    <form method="POST" class="form-box" id="electricity-form" data-guard-submit>
        {% csrf_token %}
        <div class="form-group">
            <label>Distribution Company</label>
            {{ form.provider }}
        </div>
        <div class="form-group">
            <label>Meter Type</label>
            {{ form.meter_type }}
        </div>
        <div class="form-group">
            <label>Meter Number</label>
            {{ form.meter_number }}
            <button type="button" id="verify-btn" class="btn-outline" style="margin-top:8px;">Verify Meter</button>
            <p id="verify-result" style="margin-top:8px;color:#7ED957;"></p>
        </div>
        <div class="form-group">
            <label>Phone Number (for token delivery)</label>
            {{ form.phone }}
        </div>
        <div class="form-group">
            <label>Amount (₦)</label>
            {{ form.amount }}
        </div>
        <button type="submit" class="btn-primary" id="submit-btn" disabled>Verify your meter first</button>
        <a href="{% url 'vtu_home' %}" class="btn-outline">Cancel</a>
    </form>
</section>

<script>
const providerSelect = document.querySelector('#id_provider');
const meterTypeSelect = document.querySelector('#id_meter_type');
const meterInput = document.querySelector('#id_meter_number');
const verifyBtn = document.querySelector('#verify-btn');
const verifyResult = document.querySelector('#verify-result');
const submitBtn = document.querySelector('#submit-btn');

function getCookie(name) {
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? match.pop() : '';
}

verifyBtn.addEventListener('click', async () => {
    verifyResult.textContent = 'Verifying…';
    const body = new URLSearchParams({
        provider: providerSelect.value,
        meter_number: meterInput.value,
        meter_type: meterTypeSelect.value,
        csrfmiddlewaretoken: getCookie('csrftoken'),
    });
    try {
        const res = await fetch('{% url "vtu_api_verify_electricity" %}', { method: 'POST', body });
        const data = await res.json();
        if (data.error) {
            verifyResult.textContent = data.error;
            verifyResult.style.color = '#ff6b6b';
            return;
        }
        verifyResult.textContent = `Verified: ${data.customer_name || 'meter found'}`;
        verifyResult.style.color = '#7ED957';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Pay Bill';
    } catch (e) {
        verifyResult.textContent = 'Verification failed — try again.';
        verifyResult.style.color = '#ff6b6b';
    }
});
</script>
{% endblock %}

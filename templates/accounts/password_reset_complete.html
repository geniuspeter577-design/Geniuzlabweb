{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | GeniuzLab</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <a href="{% url 'home' %}"><img src="{% static 'images/logo.png' %}" class="auth-logo" alt="GeniuzLab"></a>

        <div class="auth-success-icon"><i class="fas fa-check"></i></div>

        <h1>Password Reset!</h1>
        <p>Your password has been changed successfully. You can now log in with your new password.</p>

        <a href="{% url 'login' %}" style="display:block;text-decoration:none;">
            <button type="submit">
                Login Now
            </button>
        </a>

    </div>
</div>

</body>
</html>

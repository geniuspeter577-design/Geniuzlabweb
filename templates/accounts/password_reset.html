{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | GeniuzLab</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <a href="{% url 'login' %}" class="auth-back"><i class="fas fa-arrow-left"></i> Back to login</a>

        <a href="{% url 'home' %}"><img src="{% static 'images/logo.png' %}" class="auth-logo" alt="GeniuzLab"></a>

        <h1>Forgot Password?</h1>
        <p>Enter the email on your account and we'll send you a link to reset your password.</p>

        {% if form.errors %}
        <div class="alert alert-error">
            <i class="fas fa-circle-exclamation"></i>
            Please enter a valid email address.
        </div>
        {% endif %}

        <form method="POST" id="resetForm">
            {% csrf_token %}

            <div class="auth-field">
                <label for="id_email">Email</label>
                <input type="email" id="id_email" name="email" placeholder="you@example.com" autocomplete="email" required autofocus>
            </div>

            <button type="submit" id="resetSubmit">
                <span class="btn-spinner"></span>
                <span class="btn-label">Send Reset Link</span>
            </button>
        </form>

        <div class="auth-link">
            Remembered your password?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>
</div>

<script>
    document.getElementById('resetForm').addEventListener('submit', function () {
        var btn = document.getElementById('resetSubmit');
        btn.classList.add('is-loading');
        btn.disabled = true;
        btn.querySelector('.btn-label').textContent = 'Sending…';
    });
</script>

</body>
</html>
